<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="name"><a href="{{ "/" | relURL }}">{{ .Site.Params.author }}</a></p>
    {{ if .IsHome }}
      <h1>{{ .Site.Title }}</h1>
      <p>{{ .Site.Params.tagline }}</p>
    {{ else }}
      <p class="back"><a href="{{ "/" | relURL }}">&larr; volver al cuaderno</a></p>
    {{ end }}
  </header>

  <main>
  {{ block "main" . }}{{ end }}
  </main>

  <footer>
    <p>{{ .Site.Params.footerNote }}<br>Contacto: {{ .Site.Params.email }}</p>
  </footer>
</div>
</body>
</html>
